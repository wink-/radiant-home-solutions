  author = "Radiant Home Solutions"
  description = "Professional handyman specializing in small jobs and quick repairs in Horseheads, Corning, and Elmira NY. Same-day service for minor home fixes, installations, and maintenance. No job too small!"
  phone = "(555) 123-4567"
  email = "info@radianthomesolutions.com"
  keywords = "small handyman jobs, quick home repairs, same day service, local handyman, minor fixes, honey do list, Horseheads handyman, Corning handyman, Elmira handyman, Chemung County handyman, Southern Tier handyman, Finger Lakes handyman"
  
